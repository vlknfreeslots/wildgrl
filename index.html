<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WildGrl — Подтверждение возраста</title>
    <style>
        /* Общие стили для темного фонда */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff; /* Белый цвет текста по умолчанию */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        /* Контейнер окна предупреждения */
        .warning-box {
            background-color: #1e1e1e;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 90%;
            border: 1px solid #ffffff; /* Белая рамка */
        }

        /* Название приложения */
        .brand {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffffff; /* Белый текст */
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        /* Заголовок "Только для взрослых" */
        h2 {
            font-size: 1.5rem;
            color: #ffffff; /* Белый текст */
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* Текст предупреждения */
        p {
            font-size: 1rem;
            line-height: 1.5;
            color: #ffffff; /* Белый текст */
            margin-bottom: 30px;
        }

        /* Блок с кнопками */
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Общие стили для кнопок */
        .btn {
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Кнопка "Мне есть 18 лет" */
        .btn-success {
            background-color: #ff3366;
            color: #ffffff;
        }

        .btn-success:hover {
            background-color: #e02454;
        }

        /* Кнопка "Мне нет 18 лет" */
        .btn-danger {
            background-color: #333333;
            color: #999999;
            border: 1px solid #444444;
        }

        .btn-danger:hover {
            background-color: #444444;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="warning-box">
        <!-- Название приложения -->
        <div class="brand">WildGrl</div>
        
        <!-- Подзаголовок -->
        <h2>Только для взрослых</h2>
        
        <!-- Измененный текст сообщения -->
        <p>Приложение содержит материалы для взрослых. Доступ разрешён только совершеннолетним.</p>
        
        <!-- Кнопки выбора -->
        <div class="buttons-container">
            <!-- Ссылка для входа в приложение -->
            <a href="main.html" class="btn btn-success">Мне есть 18 лет</a>
            
            <!-- Ссылка при отказе -->
            <a href="https://yandex.ru" class="btn btn-danger">Мне нет 18 лет</a>
        </div>
    </div>

</body>
</html>
