<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f6f8fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            color: #24292f;
        }

        .container {
            text-align: center;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #d0d7de;
            border-bottom-color: #0969da;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
            margin-bottom: 20px;
        }

        .text {
            font-size: 18px;
            font-weight: 500;
        }

        .subtext {
            font-size: 14px;
            color: #57606a;
            margin-top: 8px;
        }

        .fallback-link {
            color: #0969da;
            text-decoration: none;
        }
        .fallback-link:hover {
            text-decoration: underline;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="loader"></span>
        <div class="text">Перенаправление на сайт...</div>
        <div class="subtext">
            Если ничего не произошло, <a class="fallback-link" id="redirect-link" href="https://wildgrl.net/p/imgrmuwcti0">нажмите сюда</a>.
        </div>
    </div>

    <script>
        // Ссылка для автоматического перенаправления
        const targetUrl = "https://wildgrl.net/p/imgrmuwcti0"; 
        
        // Время задержки перед редиректом (3000 миллисекунд = 3 секунды)
        const delay = 3000; 

        document.getElementById('redirect-link').href = targetUrl;

        setTimeout(function() {
            window.location.replace(targetUrl);
        }, delay);
    </script>

</body>
</html>
