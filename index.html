<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- ИСПРАВЛЕНО: Добавлены параметры блокировки зума и поддержка безопасных зон (челок) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WildGrl — Подтверждение возраста</title>
    <style>
        /* Общие стили и центрирование */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; /* ИСПРАВЛЕНО: Системные шрифты для нативности */
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            height: 100vh; 
            overflow: hidden;
            text-align: center;
            box-sizing: border-box;
            
            /* ИСПРАВЛЕНО: Защита интерфейса от наложения на челки и вырезы */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Контейнер окна предупреждения */
        .warning-box {
            background-color: #1e1e1e;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 85%;
            border: 1px solid #ffffff;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Название приложения */
        .brand {
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        /* Заголовок "Только для взрослых" */
        h2 {
            font-size: 1.3rem;
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 15px;
        }

        /* Текст предупреждения */
        p {
            font-size: 0.95rem;
            line-height: 1.4;
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 25px;
        }

        /* Блок с кнопками */
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Общие стили для кнопок */
        .btn {
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            text-decoration: none;
            display: block;
            
            /* ИСПРАВЛЕНО: Делаем поведение кнопок нативным для WebView */
            -webkit-tap-highlight-color: transparent; /* Убирает синий квадрат при клике */
            -webkit-user-select: none; /* Запрещает копирование текста кнопки при долгом нажатии */
            user-select: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Кнопка "Мне есть 18 лет" */
        .btn-success {
            background-color: #ff3366;
            color: #ffffff;
        }

        .btn-success:hover {
            background-color: #e02454;
        }

        /* Кнопка "Мне нет 18 лет" */
        .btn-danger {
            background-color: #333333;
            color: #999999;
            border: 1px solid #444444;
        }

        .btn-danger:hover {
            background-color: #444444;
            color: #ffffff;
        }

        /* Адаптивность под маленькие экраны смартфонов */
        @media (max-height: 600px), (max-width: 360px) {
            .warning-box {
                padding: 20px 15px;
            }
            .brand {
                font-size: 1.8rem;
                margin-bottom: 5px;
            }
            h2 {
                font-size: 1.1rem;
                margin-bottom: 10px;
            }
            p {
                font-size: 0.85rem;
                margin-bottom: 15px;
            }
            .btn {
                padding: 10px;
                font-size: 0.9rem;
            }
            .buttons-container {
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="warning-box">
        <div class="brand">WildGrl</div>
        <h2>Только для взрослых</h2>
        <p>Приложение содержит материалы для взрослых. Доступ разрешён только совершеннолетним.</p>
        
        <div class="buttons-container">
            <!-- Кнопка согласия (ведет на основную страницу) -->
            <a href="main.html" class="btn btn-success">Мне есть 18 лет</a>
            
            <!-- ИСПРАВЛЕНО: Вместо прямой ссылки вызываем JS-функцию для закрытия приложения -->
            <a href="#" class="btn btn-danger" onclick="closeApp(event)">Мне нет 18 лет</a>
        </div>
    </div>

    <script>
        // Функция обработки отказа от верификации
        function closeApp(event) {
            event.preventDefault(); // Отменяем переход по ссылке #
            
            // 1. Для Android (в коде приложения должен быть создан AndroidBridge)
            if (window.AndroidBridge && window.AndroidBridge.closeApplication) {
                window.AndroidBridge.closeApplication();
            } 
            // 2. Для iOS (WKWebView)
            else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.closeApplication) {
                window.webkit.messageHandlers.closeApplication.postMessage(null);
            } 
            // 3. Заглушка для обычного браузера, если открыто не в приложении
            else {
                alert("Доступ запрещен. Приложение будет закрыто.");
                window.location.href = "https://yandex.ru";
            }
        }
    </script>
</body>
</html>
