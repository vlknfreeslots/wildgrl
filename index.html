<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Ограничиваем масштабирование, чтобы страница сидела как родное приложение -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Главная</title>
    <style>
        /* Обнуляем отступы и убираем прокрутку у основного экрана */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Черный фон на случай загрузки контента */
        }
        
        /* Растягиваем фрейм на абсолютно всю видимую область телефона */
        iframe {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
        }
    </style>
</head>
<body>

    <!-- Встраиваем целевой сайт прямо внутрь вашей страницы -->
    <iframe src="https://wild-grl.org" allowfullscreen></iframe>

</body>
</html>
