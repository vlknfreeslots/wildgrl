<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WildGrl — Подтверждение возраста</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: 100vh;
            overflow: hidden;
            background-color: #121212;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-top: env(safe-area-inset-top, 20px);
            padding-bottom: env(safe-area-inset-bottom, 20px);
            padding-left: 15px;
            padding-right: 15px;
            position: relative;
        }

        /* ─── ЭКРАН ЗАГРУЗКИ (СПЛЭШ-СКРИН) ─── */
        .loader-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        /* Анимированный крутящийся индикатор загрузки */
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 51, 102, 0.1);
            border-left-color: #ff3366; /* Фирменный розовый цвет */
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Класс для плавного скрытия лоадера через JS */
        .loader-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* ─── ОСНОВНОЙ КОНТЕНТ ─── */
        .warning-box {
            background-color: #1e1e1e;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
            max-width: 380px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-height: 90%;
            
            /* Эффект плавного появления самого окна */
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        /* Класс для активации видимости окна */
        .warning-box.show {
            opacity: 1;
            transform: scale(1);
        }

        .brand {
            font-size: 2.4rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 1.25rem;
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 16px;
            font-weight: 600;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #cccccc;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            padding: 15px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        .btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        .btn-success {
            background-color: #ff3366;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(255, 51, 102, 0.3);
        }

        .btn-danger {
            background-color: #2a2a2a;
            color: #aaaaaa;
            border: 1px solid #3a3a3a;
        }

        @media (max-height: 580px), (max-width: 340px) {
            .warning-box { padding: 20px 20px; }
            .brand { font-size: 1.8rem; margin-bottom: 4px; }
            h2 { font-size: 1.1rem; margin-bottom: 10px; }
            p { font-size: 0.85rem; margin-bottom: 20px; }
            .btn { padding: 12px; font-size: 0.95rem; }
            .buttons-container { gap: 8px; }
        }
    </style>
</head>
<body>

    <!-- 1. Экран загрузки -->
    <div class="loader-screen" id="loaderScreen">
        <div class="brand">WildGrl</div>
        <div class="spinner"></div>
    </div>

    <!-- 2. Основное окно (скрыто изначально с помощью CSS-эффектов) -->
    <div class="warning-box" id="warningBox">
        <div class="brand">WildGrl</div>
        <h2>Только для взрослых</h2>
        <p>Приложение содержит материалы для взрослых. Доступ разрешён только совершеннолетним.</p>
        
        <div class="buttons-container">
            <a href="main.html" class="btn btn-success">Мне есть 18 лет</a>
            <a href="#" class="btn btn-danger" onclick="handleExit(event)">Мне нет 18 лет</a>
        </div>
    </div>

    <script>
        // Таймер на 3 секунды (3000 миллисекунд)
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const loader = document.getElementById('loaderScreen');
                const box = document.getElementById('warningBox');
                
                loader.classList.add('hidden'); // Плавно убираем лоадер
                box.classList.add('show');       // Плавно показываем форму 18+
            }, 3000); 
        });

        // Функция закрытия приложения
        function handleExit(event) {
            event.preventDefault();
            if (window.AndroidBridge && window.AndroidBridge.closeApplication) {
                window.AndroidBridge.closeApplication();
            } 
            else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.closeApplication) {
                window.webkit.messageHandlers.closeApplication.postMessage(null);
            } 
            else {
                window.location.href = "https://yandex.ru";
            }
        }
    </script>
</body>
</html>
