<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Самый надежный способ для открытия в той же вкладке на уровне HTML -->
    <meta http-equiv="refresh" content="0; url=https://wild-grl.org">
    
    <link rel="canonical" href="https://wild-grl.org">
    <title>Перенаправление...</title>
    
    <script>
        // Принудительно открываем в текущем окне (window.self)
        window.self.location.replace("https://wild-grl.org");
    </script>
</head>
<body>
    <noscript>
        <!-- Если всё отключено, резервная ссылка строго в текущем окне (target="_self") -->
        <p>Если перенаправление не произошло автоматически, 
           <a href="https://wild-grl.org" target="_self">нажмите на эту ссылку</a>.
        </p>
    </noscript>
</body>
</html>
