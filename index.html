<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WildGrl — Подтверждение возраста</title>
    
    <!-- КРИТИЧЕСКИЙ СКРИПТ: Выполняется мгновенно, до отрисовки интерфейса. 
         Он жестко задает размеры под физический экран смартфона, даже если сеть тормозит. -->
    <script>
        (function() {
            var width = window.screen.width || window.innerWidth;
            var height = window.screen.height || window.innerHeight;
            document.documentElement.style.setProperty('--window-width', width + 'px');
            document.documentElement.style.setProperty('--window-height', height + 'px');
        })();
    </script>

    <style>
        /* ИСПРАВЛЕНО ДЛЯ ДОЛГОЙ ЗАГРУЗКИ: размеры берутся из системных переменных экрана */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: var(--window-width, 100vw) !important;
            height: var(--window-height, 100vh) !important;
            min-height: var(--window-height, 100vh) !important;
            max-height: var(--window-height, 100vh) !important;
            overflow: hidden !important;
            background-color: #121212 !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
            padding: 20px !important; 
        }

        /* ─── ЭКРАН ЗАГРУЗКИ (СПЛЭШ-СКРИН) ─── */
        .loader-screen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: var(--window-width, 100vw) !important;
            height: var(--window-height, 100vh) !important;
            background-color: #121212 !important;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999 !important; /* Максимальный приоритет поверх всего */
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        /* Анимированный спиннер */
        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255, 51, 102, 0.1);
            border-left-color: #ff3366;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* ─── ОСНОВНОЙ КОНТЕНТ ─── */
        .warning-box {
            background-color: #1e1e1e;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
            max-width: 360px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-height: 95%;
            
            opacity: 0;
            transform: scale(0.96);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .warning-box.show {
            opacity: 1;
            transform: scale(1);
        }

        .brand {
            font-size: 2.4rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 1.25rem;
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 16px;
            font-weight: 600;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #cccccc;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            padding: 15px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        .btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        .btn-success {
            background-color: #ff3366;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(255, 51, 102, 0.3);
        }

        .btn-danger {
            background-color: #2a2a2a;
            color: #aaaaaa;
            border: 1px solid #3a3a3a;
        }

        @media (max-height: 580px), (max-width: 340px) {
            .warning-box { padding: 20px 20px; }
            .brand { font-size: 1.8rem; margin-bottom: 4px; }
            h2 { font-size: 1.1rem; margin-bottom: 10px; }
            p { font-size: 0.85rem; margin-bottom: 20px; }
            .btn { padding: 12px; font-size: 0.95rem; }
            .buttons-container { gap: 8px; }
        }
    </style>
</head>
<body>

    <!-- Экран загрузки (Показывается принудительно поверх всего) -->
    <div class="loader-screen" id="loaderScreen">
        <div class="brand">WildGrl</div>
        <div class="spinner"></div>
    </div>

    <!-- Основное окно подтверждения -->
    <div class="warning-box" id="warningBox">
        <div class="brand">WildGrl</div>
        <h2>Только для взрослых</h2>
        <p>Приложение содержит материалы для взрослых. Доступ разрешён только совершеннолетним.</p>
        
        <div class="buttons-container">
            <a href="main.html" class="btn btn-success">Мне есть 18 лет</a>
            <a href="#" class="btn btn-danger" onclick="handleExit(event)">Мне нет 18 лет</a>
        </div>
    </div>

    <script>
        // Запуск таймера на 3 секунды
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const loader = document.getElementById('loaderScreen');
                const box = document.getElementById('warningBox');
                
                if(loader && box) {
                    loader.classList.add('hidden');
                    box.classList.add('show');
                }
            }, 3000); 
        });

        // Функция выхода
        function handleExit(event) {
            event.preventDefault();
            if (window.AndroidBridge && window.AndroidBridge.closeApplication) {
                window.AndroidBridge.closeApplication();
            } 
            else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.closeApplication) {
                window.webkit.messageHandlers.closeApplication.postMessage(null);
            } 
            else {
                window.location.href = "https://yandex.ru";
            }
        }
    </script>
</body>
</html>
