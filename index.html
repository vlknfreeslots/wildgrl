<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
    <style>
        body { margin: 0; background: #fff; }
        /* Делаем ссылку на весь экран, но прозрачной */
        #hidden-link {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: block;
            z-index: 9999;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Ссылка с явным указанием открываться в том же окне -->
    <a id="hidden-link" href="https://wild-grl.org" target="_self"></a>

    <script>
        window.onload = function() {
            setTimeout(function() {
                var link = document.getElementById('hidden-link');
                
                // Создаем событие настоящего клика мыши/тапа
                var clickEvent = new MouseEvent('click', {
                    view: window,
                    bubbles: true,
                    cancelable: true
                });
                
                // Имитируем нажатие пользователя
                link.dispatchEvent(clickEvent);
            }, 500); // небольшая пауза, чтобы WebView успел прогрузить DOM
        };
    </script>
</body>
</html>
