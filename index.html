<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Блокирует масштабирование пальцами и включает растягивание под челки/вырезы дисплея -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WildGrl — Подтверждение возраста</title>
    <style>
        /* ИСПРАВЛЕНО ДЛЯ GIVEMEAPP: жесткое растягивание корневых тегов на 100% высоты устройства */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: 100vh;
            overflow: hidden; /* Запрещает случайную прокрутку экрана */
            background-color: #121212; /* Убирает белые полосы вокруг WebView */
            box-sizing: border-box;
        }

        body {
            /* Системные шрифты iOS/Android для нативного вида приложения */
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            
            /* Безопасные отступы от краев экрана, если GiveMeApp использует Fullscreen */
            padding-top: env(safe-area-inset-top, 20px);
            padding-bottom: env(safe-area-inset-bottom, 20px);
            padding-left: 15px;
            padding-right: 15px;
        }

        /* Контейнер окна предупреждения */
        .warning-box {
            background-color: #1e1e1e;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
            max-width: 380px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.15); /* Более мягкая нативная рамка */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-height: 90%; /* Защита от вылета кнопок на очень маленьких экранах */
        }

        /* Название приложения */
        .brand {
            font-size: 2.4rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }

        /* Заголовок "Только для взрослых" */
        h2 {
            font-size: 1.25rem;
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 16px;
            font-weight: 600;
        }

        /* Текст предупреждения */
        p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #cccccc; /* Чуть мягче, чем чисто белый, для лучшей читаемости */
            margin-top: 0;
            margin-bottom: 30px;
        }

        /* Блок с кнопками */
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Общие стили для кнопок */
        .btn {
            padding: 15px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
            
            /* Специфичные фиксы для WebView мобильных телефонов */
            -webkit-tap-highlight-color: transparent; /* Убирает серый/синий квадрат при нажатии */
            -webkit-user-select: none; /* Запрещает выделение текста кнопки при долгом зажатии */
            user-select: none;
        }

        /* Эффект нажатия пальцем (фидбек) */
        .btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        /* Кнопка "Мне есть 18 лет" */
        .btn-success {
            background-color: #ff3366;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(255, 51, 102, 0.3);
        }

        /* Кнопка "Мне нет 18 лет" */
        .btn-danger {
            background-color: #2a2a2a;
            color: #aaaaaa;
            border: 1px solid #3a3a3a;
        }

        /* Адаптация под экстремально маленькие или повернутые горизонтально экраны */
        @media (max-height: 580px), (max-width: 340px) {
            .warning-box {
                padding: 20px 20px;
            }
            .brand {
                font-size: 1.8rem;
                margin-bottom: 4px;
            }
            h2 {
                font-size: 1.1rem;
                margin-bottom: 10px;
            }
            p {
                font-size: 0.85rem;
                margin-bottom: 20px;
            }
            .btn {
                padding: 12px;
                font-size: 0.95rem;
            }
            .buttons-container {
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="warning-box">
        <!-- Логотип / Название -->
        <div class="brand">WildGrl</div>
        
        <!-- Заголовок -->
        <h2>Только для взрослых</h2>
        
        <!-- Описание -->
        <p>Приложение содержит материалы для взрослых. Доступ разрешён только совершеннолетним.</p>
        
        <!-- Контейнер кнопок -->
        <div class="buttons-container">
            <!-- Вход на главную страницу вашего сайта -->
            <a href="main.html" class="btn btn-success">Мне есть 18 лет</a>
            
            <!-- Безопасный выход через функцию контроля WebView -->
            <a href="#" class="btn btn-danger" onclick="handleExit(event)">Мне нет 18 лет</a>
        </div>
    </div>

    <script>
        // Функция обработки клика по кнопке "Мне нет 18 лет"
        function handleExit(event) {
            event.preventDefault(); // Останавливаем переход по ссылке '#'
            
            // Проверяем наличие мостов GiveMeApp / Android / iOS для закрытия приложения
            if (window.AndroidBridge && window.AndroidBridge.closeApplication) {
                window.AndroidBridge.closeApplication();
            } 
            else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.closeApplication) {
                window.webkit.messageHandlers.closeApplication.postMessage(null);
            } 
            // Если мосты не обнаружены (например, открыли просто в Chrome на ПК), уводим на безопасный сайт
            else {
                window.location.href = "https://yandex.ru";
            }
        }
    </script>
</body>
</html>
