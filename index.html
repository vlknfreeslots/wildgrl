<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Блокируем масштабирование, чтобы сайт сидел как родное приложение -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Загрузка...</title>
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; text-align: center; background: #fff; color: #333; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #0969da; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 40px auto 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader-container">
        <div class="spinner"></div>
        <p>Синхронизация с сервером...</p>
    </div>

    <script>
        window.onload = function() {
            // Целевой сайт, который мы хотим отобразить
            const targetUrl = 'https://wild-grl.org';

            // Скачиваем HTML-код целевого сайта через прокси "allorigins"
            fetch('https://allorigins.win' + encodeURIComponent(targetUrl))
                .then(response => {
                    if (response.ok) return response.json();
                    throw new Error('Ошибка загрузки данных');
                })
                .then(data => {
                    // Полностью стираем страницу GitHub и перезаписываем её скачанным кодом
                    document.open();
                    document.write(data.contents);
                    document.close();
                })
                .catch(err => {
                    // Резервный случай, если у пользователя совсем пропал интернет
                    document.getElementById('loader-container').innerHTML = 
                        '<p>Не удалось подключиться к серверу. Пожалуйста, проверьте подключение к сети.</p>';
                });
        };
    </script>
</body>
</html>
