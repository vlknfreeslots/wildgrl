<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Мгновенное перенаправление на уровне HTML для браузеров и роботов -->
    <meta http-equiv="refresh" content="0; url=https://wild-grl.org/">
    
    <!-- Ссылка на каноническую страницу сайта wild-grl.org -->
    <link rel="canonical" href="https://wild-grl.org/">
    
    <title>Перенаправление...</title>
    
    <!-- Моментальный редирект через JavaScript (не оставляет страницу в истории браузера) -->
    <script>
        window.location.replace("https://wild-grl.org/");
    </script>
</head>
<body>
    <!-- Резервный блок для редких случаев, когда скрипты и мета-теги отключены -->
    <noscript>
        <p>Если перенаправление не произошло автоматически, 
           <a href="https://wild-grl.org/">нажмите на эту ссылку</a>.
        </p>
    </noscript>
</body>
</html>
